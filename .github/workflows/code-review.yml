name: Code Review

# Reviews every pull request with the kantan-hp reusable OpenCodeReview (OCR)
# workflow (alibaba/open-code-review, OSS) against the OpenCode Go plan
# (deepseek-v4-flash). Runs automatically on all PRs (private and public); the
# reusable workflow in kantan-hp/.github handles the same-repo gate and posts the
# review. Requires the repo secret OCR_LLM_AUTH_TOKEN (OpenCode Go API key).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  code-review:
    permissions:
      contents: read
      pull-requests: write
    uses: kantan-hp/.github/.github/workflows/code-review.yml@main
    secrets:
      llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
