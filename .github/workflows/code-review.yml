name: Code Review

# On-demand OpenCodeReview (OCR) for a PRIVATE repo. Triggered only by an
# /open-code-review (or @open-code-review) comment from a collaborator, so there
# is no per-PR Actions cost. The reusable workflow in kantan-hp/.github handles
# the trusted-commenter and same-repo gates and posts the review. Requires the
# repo secret OCR_LLM_AUTH_TOKEN (OpenCode Go API key).
on:
  issue_comment:
    types: [created]

jobs:
  code-review:
    permissions:
      contents: read
      pull-requests: write
    uses: kantan-hp/.github/.github/workflows/code-review.yml@main
    secrets:
      llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
